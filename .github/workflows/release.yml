name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: true
        type: string

env:
  PROJECT_NAME: QuarantineRemover
  SCHEME: QuarantineRemover
  CONFIGURATION: Release

jobs:
  create-release:
    name: Create Release
    runs-on: macos-14
    permissions:
      contents: write
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Select Xcode Version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.0'
      
      - name: Determine Version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            VERSION=${GITHUB_REF#refs/tags/v}
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          fi
      
      - name: Update Version in Info.plist
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${{ steps.version.outputs.version }}" \
            "${{ env.PROJECT_NAME }}/Info.plist" || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ steps.version.outputs.version }}" \
            "${{ env.PROJECT_NAME }}/Info.plist" || true
      
      - name: Clean Build
        run: |
          xcodebuild clean \
            -project "${{ env.PROJECT_NAME }}.xcodeproj" \
            -scheme "${{ env.SCHEME }}"
      
      - name: Build Release
        run: |
          xcodebuild build \
            -project "${{ env.PROJECT_NAME }}.xcodeproj" \
            -scheme "${{ env.SCHEME }}" \
            -configuration "${{ env.CONFIGURATION }}" \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
      
      - name: Create DMG
        run: |
          # Create a directory for the DMG contents
          mkdir -p dmg_temp
          cp -R "Build/Products/${{ env.CONFIGURATION }}/${{ env.PROJECT_NAME }}.app" dmg_temp/
          
          # Create Applications symlink
          ln -s /Applications dmg_temp/Applications
          
          # Create DMG
          hdiutil create -volname "${{ env.PROJECT_NAME }}" \
            -srcfolder dmg_temp \
            -ov -format UDZO \
            "${{ env.PROJECT_NAME }}-${{ steps.version.outputs.version }}.dmg"
          
          # Cleanup
          rm -rf dmg_temp
      
      - name: Calculate Checksum
        run: |
          shasum -a 256 "${{ env.PROJECT_NAME }}-${{ steps.version.outputs.version }}.dmg" > checksum.txt
          cat checksum.txt
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          body: |
            ## What's Changed
            
            See the commit history for detailed changes.
            
            ### Installation
            
            1. Download `${{ env.PROJECT_NAME }}-${{ steps.version.outputs.version }}.dmg`
            2. Open the DMG file
            3. Drag `${{ env.PROJECT_NAME }}.app` to Applications folder
            4. Right-click the app and select "Open" (first time only)
            
            ### Checksum
            
            ```
            $(cat checksum.txt)
            ```
          files: |
            ${{ env.PROJECT_NAME }}-${{ steps.version.outputs.version }}.dmg
            checksum.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Upload DMG as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROJECT_NAME }}-${{ steps.version.outputs.version }}.dmg
          path: ${{ env.PROJECT_NAME }}-${{ steps.version.outputs.version }}.dmg
          retention-days: 90
